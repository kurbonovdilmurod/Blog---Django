<div class="p-6 bg-gray-100">
    <h2 class="mb-6 text-xl">{{ post.title }}</h2>
    <span>{{ post.created_on }} </span> | Categories: {% for category in post.categories.all %} <a href="{% url 'blog_category' category.name %}">{{ category.name }}</a> {% endfor %}

    <a href="{% url 'blog_detail' post.slug %}" class="text-emerald-700">Read more</a>
</div>
