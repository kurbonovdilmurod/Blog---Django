{% extends "blog/base.html" %}

{% block content %}
<h1>{{ category }}</h1>
<div class="mt-8">
    {% for post in posts %}
        <h1 class="text-xl font-bold"><a href="{% url 'blog_detail' post.slug %}">{{ post.title }}</a></h1>
        <p>{{ post.content | slice:"200"}}</p><br>
    {% endfor %}
</div>


{% endblock content %}
